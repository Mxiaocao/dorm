# Nginx 反向代理配置示例
# 用法：
#   1. 把 dorm.yourdomain.com 换成你的域名
#   2. cp deploy.nginx.conf /etc/nginx/sites-available/dorm
#   3. ln -s /etc/nginx/sites-available/dorm /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx
#
# 有了域名后建议再配 HTTPS（certbot）：
#   certbot --nginx -d dorm.yourdomain.com

server {
    listen 80;
    server_name dorm.yourdomain.com;

    # 如果不用域名，只想用 IP 访问，把上面一行改成：
    #   listen 80;
    #   server_name _;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}