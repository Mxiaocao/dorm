<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>寝室卫生安排</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#f5f6f8;color:#1f2329;padding:16px}
h1{font-size:20px;margin-bottom:12px}
h2{font-size:15px;margin-bottom:10px}
.card{background:#fff;border:1px solid #e5e6eb;border-radius:8px;padding:14px;margin-bottom:12px}
input,select,button{font-size:14px;padding:7px 10px;border:1px solid #d0d3d6;border-radius:6px}
button{cursor:pointer;background:#2f6feb;color:#fff;border:none}
button.ghost{background:#eef1f5;color:#1f2329}
button.del{background:#e54d42}
input[type=date]{width:150px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #f0f1f3}
th{color:#646a73;font-weight:500}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:#fff;color:#1f2329;border:1px solid #d0d3d6}
.tabs button.on{background:#2f6feb;color:#fff;border-color:#2f6feb}
.done{color:#9aa0a6;text-decoration:line-through}
.tag{background:#eef1f5;border-radius:4px;padding:1px 6px;font-size:12px}
.hide{display:none}
.today{background:#fff8e6;border-color:#ffd666}
</style>
</head>
<body>
<h1>寝室卫生安排</h1>

<div id="login" class="hide" style="position:fixed;inset:0;background:#f5f6f8;z-index:99;display:flex;align-items:center;justify-content:center">
  <div class="card" style="width:300px">
    <h2>寝室卫生安排</h2>
    <p style="font-size:13px;color:#646a73;margin-bottom:10px">请输入寝室口令后使用</p>
    <div class="row">
      <input id="passInput" type="password" placeholder="口令" style="flex:1">
      <button onclick="doLogin()">进入</button>
    </div>
  </div>
</div>

<div class="tabs" id="tabs">
  <button data-t="mine" class="on">我的任务</button>
  <button data-t="today">今日任务</button>
  <button data-t="task">任务管理</button>
  <button data-t="rotate">轮换安排</button>
  <button data-t="member">成员管理</button>
  <button data-t="history">完成历史</button>
</div>

<!-- 我的任务 -->
<div id="v-mine">
  <div class="card today">
    <div class="row" style="margin-bottom:10px">
      <b style="font-size:15px">我是</b>
      <select id="whoami" onchange="renderMine()" style="min-width:120px"></select>
    </div>
    <div id="mineToday"></div>
  </div>
  <div class="card">
    <h2>我接下来 7 天</h2>
    <div id="mineWeek"></div>
  </div>
</div>

<p id="syncTip" style="font-size:13px;color:#646a73;margin-bottom:10px">本地模式：数据仅保存在本机浏览器。</p>

<!-- 今日任务 -->
<div id="v-today">
  <div class="card today">
    <h2 id="todayTitle">今日任务</h2>
    <div id="todayList"></div>
  </div>
  <div class="card">
    <h2>未来 7 天预览</h2>
    <div id="weekList"></div>
  </div>
</div>

<!-- 任务管理 -->
<div id="v-task" class="hide">
  <div class="card">
    <h2>新建任务</h2>
    <div class="row">
      <input id="tName" placeholder="任务名，如：倒垃圾">
      <input type="date" id="tDate">
      <select id="tOwner"></select>
      <button onclick="addTask()">添加</button>
    </div>
  </div>
  <div class="card">
    <h2>任务列表</h2>
    <div id="taskList"></div>
  </div>
</div>

<!-- 轮换安排 -->
<div id="v-rotate" class="hide">
  <div class="card">
    <h2>轮换规则</h2>
    <div class="row">
      <select id="rTask"></select>
      <input type="date" id="rStart">
      <label style="font-size:14px"><input type="checkbox" id="rSkip" style="width:auto;margin-right:4px">跳过周末</label>
      <button onclick="addRotate()">生成排班</button>
    </div>
    <p style="font-size:13px;color:#646a73;margin-top:8px">按成员顺序循环分配，从开始日期起每天一人；勾选跳过后周六日不排班、不占用轮换序号。</p>
    <div class="row" style="margin-top:10px">
      <button onclick="genAll()">生成未来 60 天任务</button>
      <span style="font-size:13px;color:#646a73">生成后这些排班会进入「今日任务」，可标记完成</span>
    </div>
  </div>
  <div class="card">
    <h2>排班表</h2>
    <div id="rotList"></div>
  </div>
</div>

<!-- 成员管理 -->
<div id="v-member" class="hide">
  <div class="card">
    <h2>添加成员</h2>
    <div class="row">
      <input id="mName" placeholder="姓名">
      <button onclick="addMember()">添加</button>
    </div>
  </div>
  <div class="card">
    <h2>成员列表</h2>
    <div id="memList"></div>
  </div>
</div>

<!-- 历史 -->
<div id="v-history" class="hide">
  <div class="card">
    <h2>完成历史</h2>
    <div id="hisList"></div>
  </div>
  <div class="card" id="dataCard">
    <h2>数据备份</h2>
    <div class="row">
      <button class="ghost" onclick="exportData()">导出备份文件</button>
      <button class="ghost" onclick="document.getElementById('importFile').click()">导入备份</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(this)">
      <button class="del" onclick="resetData()">清空全部数据</button>
    </div>
    <p style="font-size:13px;color:#646a73;margin-top:8px">数据保存在本机浏览器，换设备或清缓存前请先导出备份。</p>
  </div>
</div>

<script>
var KEY='dorm_v1';
var MODE='local';            // local | server
var PASS=sessionStorage.getItem('dorm_pass')||'';
var db=init();

// 本地模式读写
function load(){try{return JSON.parse(localStorage.getItem(KEY))||init();}catch(e){return init();}}
function save(){if(MODE==='local')localStorage.setItem(KEY,JSON.stringify(db));}

// 启动：有后端则校验口令并拉云端数据，没有则纯本地
function boot(){
  fetch('/api/state',{headers:{'x-passcode':PASS}})
    .then(function(r){
      if(r.status===401)return showLogin();
      if(!r.ok)throw new Error();
      MODE='server';hideLogin();
      return r.json().then(function(d){db=norm(d);initUI();});
    })
    .catch(function(){MODE='local';db=load();initUI();});
}

function norm(d){
  return{members:d.members||[],tasks:d.tasks||[],rotates:d.rotates||[],done:d.done||{}};
}
function api(url,body){
  return fetch(url,{method:'POST',headers:{'Content-Type':'application/json','x-passcode':PASS},
    body:JSON.stringify(body||{})})
    .then(function(r){return r.json().then(function(j){
      if(!r.ok)throw new Error(j.error||'操作失败');return j;});});
}
function refresh(){
  if(MODE!=='server')return Promise.resolve();
  return fetch('/api/state',{headers:{'x-passcode':PASS}})
    .then(function(r){return r.json();})
    .then(function(d){db=norm(d);renderAll();});
}
function act(fn){
  fn();
  if(MODE==='server')return refresh();
  save();renderAll();
}
function showLogin(){document.getElementById('login').classList.remove('hide');}
function hideLogin(){document.getElementById('login').classList.add('hide');}
function doLogin(){
  PASS=document.getElementById('passInput').value;
  sessionStorage.setItem('dorm_pass',PASS);
  fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({passcode:PASS})})
    .then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error);return j;});})
    .then(function(){hideLogin();boot();})
    .catch(function(e){alert(e.message||'口令错误');});
}

function initUI(){
  document.getElementById('tDate').value=todayStr();
  document.getElementById('rStart').value=todayStr();
  if(MODE==='server'){
    document.getElementById('syncTip').textContent='已连接服务器，全寝室共享数据。';
    document.getElementById('dataCard').classList.add('hide');
  }
  renderAll();
}

function init(){return{members:[],tasks:[],rotates:[],done:{}};}

function todayStr(){var d=new Date();return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function p(n){return n<10?'0'+n:''+n;}
function fmt(s){return s.slice(5);}

// 成员
function addMember(){
  var n=document.getElementById('mName').value.trim();
  if(!n)return;
  document.getElementById('mName').value='';
  if(MODE==='server')return api('/api/member',{name:n}).then(refresh).catch(er);
  act(function(){db.members.push({id:Date.now(),name:n});});
}
function delMember(id){
  if(!confirm('确定删除该成员？其任务会变成「未指定」。'))return;
  if(MODE==='server')return api('/api/member/delete',{id:id}).then(refresh).catch(er);
  act(function(){db.members=db.members.filter(function(m){return m.id!==id;});});
}

// 任务
function addTask(){
  var n=document.getElementById('tName').value.trim();
  var d=document.getElementById('tDate').value;
  var o=document.getElementById('tOwner').value;
  if(!n||!d)return alert('请填写任务名和日期');
  document.getElementById('tName').value='';
  if(MODE==='server')return api('/api/task',{name:n,date:d,owner:o?Number(o):0}).then(refresh).catch(er);
  act(function(){db.tasks.push({id:Date.now(),name:n,date:d,owner:o?Number(o):0});});
}
function delTask(id){
  if(!confirm('确定删除该任务？'))return;
  if(MODE==='server')return api('/api/task/delete',{id:id}).then(refresh).catch(er);
  act(function(){
    db.tasks=db.tasks.filter(function(t){return t.id!==id;});
    delete db.done[id];
  });
}
function toggleDone(key){
  var date=db.done[key]?'':todayStr();
  if(MODE==='server')return api('/api/done',{taskId:key,date:date}).then(refresh).catch(er);
  act(function(){ date?(db.done[key]=date):(delete db.done[key]); });
}
function er(e){alert(e.message||'操作失败');}
function isDone(t){return !!db.done[t.id];}
function mname(id){var m=db.members.filter(function(x){return x.id===id;})[0];return m?m.name:'未指定';}

// 轮换
function addRotate(){
  var tid=Number(document.getElementById('rTask').value);
  var start=document.getElementById('rStart').value;
  var skip=document.getElementById('rSkip').checked;
  if(!tid||!start)return alert('请选择任务和开始日期');
  if(MODE==='server')return api('/api/rotate',{taskId:tid,start:start,skipWeekend:skip}).then(refresh).catch(er);
  act(function(){db.rotates.push({id:Date.now(),taskId:tid,start:start,skipWeekend:skip});});
}
function rotateList(r){
  var out=[],mem=db.members;
  if(!mem.length)return out;
  var t=db.tasks.filter(function(x){return x.id===r.taskId;})[0];
  if(!t)return out;
  var idx=db.rotates.indexOf(r);
  var n=0;
  for(var i=0;i<120;i++){
    var d=new Date(r.start);d.setDate(d.getDate()+i);
    var s=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
    var wd=d.getDay();
    if(r.skipWeekend&&(wd===0||wd===6))continue;
    if(n>=60)break;
    var mm=mem[(n+idx)%mem.length];
    out.push({date:s,name:t.name,member:mm.name,ownerId:mm.id});
    n++;
  }
  return out;
}

// 把全部排班写成任务
function genAll(){
  if(!db.members.length)return alert('请先到「成员管理」添加成员');
  if(!db.rotates.length)return alert('请先创建一条排班规则');
  var go=function(){
    var n=0;
    db.rotates.forEach(function(r){n+=genRotateTasks(r);});
    return n;
  };
  if(MODE==='server'){
    var rid=db.rotates.map(function(r){return r.id;});
    Promise.all(rid.map(function(id){return api('/api/rotate/generate',{rotateId:id});}))
      .then(function(rs){var t=rs.reduce(function(a,b){return a+(b.created||0);},0);refresh().then(function(){alert('已生成 '+t+' 条任务');});})
      .catch(er);
    return;
  }
  var n=go();
  act(function(){});
  alert(n?('已生成 '+n+' 条任务'):'所有日期都已生成过了，无需重复');
}

// 把排班真正写成任务，这样「今日任务」和完成记录才有内容
// 已经生成过的日期不会重复生成
function genRotateTasks(r){
  var list=rotateList(r);
  var made=0;
  list.forEach(function(x){
    var exist=db.tasks.filter(function(t){return t.name===x.name&&t.date===x.date;})[0];
    if(!exist){db.tasks.push({id:Date.now()+made,name:x.name,date:x.date,owner:x.ownerId});made++;}
  });
  return made;
}

// 渲染
function renderMine(){
  var id=document.getElementById('whoami').value;
  if(!id){
    document.getElementById('mineToday').innerHTML=db.members.length?
      '<p style="color:#9aa0a6">请选择你是谁</p>':
      '<p style="color:#9aa0a6">还没有成员，请先到「成员管理」添加</p>';
    document.getElementById('mineWeek').innerHTML='';
    return;
  }
  var mid=Number(id);
  var t=todayStr();
  var today=db.tasks.filter(function(x){return x.date===t&&x.owner===mid;});
  document.getElementById('mineToday').innerHTML=today.length?
    today.map(function(x){
      return '<div style="padding:8px 0;border-bottom:1px solid #f0f1f3">'+
        '<span class="'+(isDone(x)?'done':'')+'">'+esc(x.name)+'</span> '+
        '<span class="tag">'+(isDone(x)?'已完成':'待完成')+'</span> '+
        '<button onclick="toggleDone('+x.id+')">'+(isDone(x)?'撤销':'完成')+'</button></div>';
    }).join(''):
    '<p style="color:#9aa0a6;padding:8px 0">今天没有分给你的活，休息一下</p>';

  var w='';
  for(var i=0;i<7;i++){
    var d=new Date();d.setDate(d.getDate()+i);
    var s=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
    var items=db.tasks.filter(function(x){return x.date===s&&x.owner===mid;});
    w+='<div style="padding:6px 0;border-bottom:1px solid #f0f1f3"><b>'+(i===0?'今天':fmt(s))+'</b> '+
      (items.length?items.map(function(x){return '<span class="'+(isDone(x)?'done':'')+'">'+esc(x.name)+'</span>';}).join('、'):'<span style="color:#9aa0a6">无</span>')+'</div>';
  }
  document.getElementById('mineWeek').innerHTML=w;
}

function renderAll(){
  var om='<option value="">未指定</option>'+db.members.map(function(m){return '<option value="'+m.id+'">'+esc(m.name)+'</option>'}).join('');
  document.getElementById('tOwner').innerHTML=om;
  document.getElementById('rTask').innerHTML=db.tasks.map(function(t){return '<option value="'+t.id+'">'+esc(t.name)+'（'+fmt(t.date)+'）</option>'}).join('');
  var who=document.getElementById('whoami');
  var keep=who.value;
  who.innerHTML='<option value="">请选择</option>'+db.members.map(function(m){return '<option value="'+m.id+'">'+esc(m.name)+'</option>'}).join('');
  who.value=keep;
  document.getElementById('todayTitle').textContent='今日任务 · '+todayStr();
  renderMine();renderToday();renderWeek();renderTasks();renderRotate();renderMember();renderHistory();
}
function esc(s){return String(s).replace(/[<>&]/g,'');}

function taskHtml(t,showDate){
  return '<table><tr><th>任务</th><th>负责人</th><th>'+(showDate?'日期':'状态')+'</th><th></th></tr>'+
   db.tasks.filter(function(x){return showDate?x.id===t.id:x.date===t.date;}).map(function(x){
    return '<tr class="'+(isDone(x)?'done':'')+'"><td>'+esc(x.name)+'</td><td>'+esc(mname(x.owner))+'</td>'+
    '<td>'+(showDate?fmt(x.date):(isDone(x)?'<span class="tag">已完成</span>':'<span class="tag">待完成</span>'))+'</td>'+
    '<td><button onclick="toggleDone('+x.id+')">'+(isDone(x)?'撤销':'完成')+'</button>'+
    (showDate?' <button class="del" onclick="delTask('+x.id+')">删</button>':'')+'</td></tr>';
  }).join('')+'</table>';
}

function renderToday(){
  var ts=db.tasks.filter(function(t){return t.date===todayStr();});
  document.getElementById('todayList').innerHTML=ts.length?taskHtml(ts[0],false):'<p style="color:#9aa0a6">今天没有安排任务</p>';
}
function renderWeek(){
  var w='';
  for(var i=1;i<=7;i++){
    var d=new Date();d.setDate(d.getDate()+i);
    var s=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
    var items=db.tasks.filter(function(t){return t.date===s;});
    w+='<div style="padding:6px 0;border-bottom:1px solid #f0f1f3"><b>'+fmt(s)+'</b> '+
      (items.length?items.map(function(t){return esc(t.name)+'（'+esc(mname(t.owner))+'）';}).join('、'):'<span style="color:#9aa0a6">无</span>')+'</div>';
  }
  document.getElementById('weekList').innerHTML=w;
}
function renderTasks(){
  var ds={};db.tasks.forEach(function(t){(ds[t.date]=ds[t.date]||[]).push(t);});
  var keys=Object.keys(ds).sort();
  document.getElementById('taskList').innerHTML=keys.length?keys.map(function(k){return '<h2 style="margin-top:10px">'+fmt(k)+'</h2>'+taskHtml(ds[k][0],true);}).join(''):'<p style="color:#9aa0a6">暂无任务</p>';
}
function renderRotate(){
  var h=db.rotates.map(function(r){
    var t=db.tasks.filter(function(x){return x.id===r.taskId;})[0];
    return '<h2 style="margin-top:10px">'+esc(t?t.name:'已删除')+' · 起 '+fmt(r.start)+'</h2><table><tr><th>日期</th><th>负责人</th></tr>'+
      rotateList(r).slice(0,14).map(function(x){return '<tr><td>'+fmt(x.date)+'</td><td>'+esc(x.member)+'</td></tr>';}).join('')+'</table>';
  }).join('');
  document.getElementById('rotList').innerHTML=h||'<p style="color:#9aa0a6">暂无排班</p>';
}
function renderMember(){
  document.getElementById('memList').innerHTML=db.members.length?
   '<table><tr><th>姓名</th><th></th></tr>'+db.members.map(function(m){
    return '<tr><td>'+esc(m.name)+'</td><td><button class="del" onclick="delMember('+m.id+')">删除</button></td></tr>';}).join('')+'</table>'
   :'<p style="color:#9aa0a6">暂无成员</p>';
}
function renderHistory(){
  var e=Object.keys(db.done).map(function(k){
    var t=db.tasks.filter(function(x){return String(x.id)===String(k);})[0];
    return {k:k,d:db.done[k],n:t?t.name:'已删除任务',o:t?mname(t.owner):''};}).filter(function(x){return x.d;});
  e.sort(function(a,b){return a.d<b.d?1:-1;});
  document.getElementById('hisList').innerHTML=e.length?
   '<table><tr><th>日期</th><th>任务</th><th>负责人</th></tr>'+e.map(function(x){
    return '<tr><td>'+x.d+'</td><td>'+esc(x.n)+'</td><td>'+esc(x.o)+'</td></tr>';}).join('')+'</table>'
   :'<p style="color:#9aa0a6">还没有完成记录</p>';
}

// 备份
function exportData(){
  var blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='dorm-backup-'+todayStr()+'.json';
  a.click();
}
function importData(input){
  var f=input.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.members)||!Array.isArray(d.tasks))throw new Error('格式不对');
      if(!confirm('导入将覆盖当前全部数据，确定继续？'))return;
      db={members:d.members,tasks:d.tasks,rotates:d.rotates||[],done:d.done||{}};
      act(function(){});alert('导入成功');
    }catch(e){alert('导入失败：文件格式不正确');}
    input.value='';
  };
  r.readAsText(f);
}
function resetData(){
  if(!confirm('确定清空全部成员、任务、排班和完成记录？此操作不可撤销。'))return;
  if(MODE==='server')return api('/api/reset',{}).then(refresh).catch(er);
  db=init();act(function(){});
}

// tabs
document.querySelectorAll('#tabs button').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('#tabs button').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on');
    ['mine','today','task','rotate','member','history'].forEach(function(t){
      document.getElementById('v-'+t).classList.toggle('hide',t!==b.dataset.t);});
  };
});

boot();
</script>
</body>
</html>
