<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>寝室卫生安排</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:#f5f6f8;color:#1f2329;padding:16px}
h1{font-size:20px;margin-bottom:12px}
h2{font-size:15px;margin-bottom:10px}
.card{background:#fff;border:1px solid #e5e6eb;border-radius:8px;padding:14px;margin-bottom:12px}
input,select,button{font-size:14px;padding:7px 10px;border:1px solid #d0d3d6;border-radius:6px}
button{cursor:pointer;background:#2f6feb;color:#fff;border:none}
button.ghost{background:#eef1f5;color:#1f2329}
button.del{background:#e54d42}
input[type=date]{width:150px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid #f0f1f3}
th{color:#646a73;font-weight:500}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{background:#fff;color:#1f2329;border:1px solid #d0d3d6}
.tabs button.on{background:#2f6feb;color:#fff;border-color:#2f6feb}
.done{color:#9aa0a6;text-decoration:line-through}
.tag{background:#eef1f5;border-radius:4px;padding:1px 6px;font-size:12px}
.hide{display:none}
.today{background:#fff8e6;border-color:#ffd666}
</style>
</head>
<body>
<h1>寝室卫生安排</h1>

<div class="tabs" id="tabs">
  <button data-t="today" class="on">今日任务</button>
  <button data-t="task">任务管理</button>
  <button data-t="rotate">轮换安排</button>
  <button data-t="member">成员管理</button>
  <button data-t="history">完成历史</button>
</div>

<!-- 今日任务 -->
<div id="v-today">
  <div class="card today">
    <h2 id="todayTitle">今日任务</h2>
    <div id="todayList"></div>
  </div>
  <div class="card">
    <h2>未来 7 天预览</h2>
    <div id="weekList"></div>
  </div>
</div>

<!-- 任务管理 -->
<div id="v-task" class="hide">
  <div class="card">
    <h2>新建任务</h2>
    <div class="row">
      <input id="tName" placeholder="任务名，如：倒垃圾">
      <input type="date" id="tDate">
      <select id="tOwner"></select>
      <button onclick="addTask()">添加</button>
    </div>
  </div>
  <div class="card">
    <h2>任务列表</h2>
    <div id="taskList"></div>
  </div>
</div>

<!-- 轮换安排 -->
<div id="v-rotate" class="hide">
  <div class="card">
    <h2>轮换规则</h2>
    <div class="row">
      <select id="rTask"></select>
      <input type="date" id="rStart">
      <label style="font-size:14px"><input type="checkbox" id="rSkip" style="width:auto;margin-right:4px">跳过周末</label>
      <button onclick="addRotate()">生成排班</button>
    </div>
    <p style="font-size:13px;color:#646a73;margin-top:8px">按成员顺序循环分配，从开始日期起每天一人；勾选跳过后周六日不排班、不占用轮换序号。</p>
  </div>
  <div class="card">
    <h2>排班表</h2>
    <div id="rotList"></div>
  </div>
</div>

<!-- 成员管理 -->
<div id="v-member" class="hide">
  <div class="card">
    <h2>添加成员</h2>
    <div class="row">
      <input id="mName" placeholder="姓名">
      <button onclick="addMember()">添加</button>
    </div>
  </div>
  <div class="card">
    <h2>成员列表</h2>
    <div id="memList"></div>
  </div>
</div>

<!-- 历史 -->
<div id="v-history" class="hide">
  <div class="card">
    <h2>完成历史</h2>
    <div id="hisList"></div>
  </div>
  <div class="card">
    <h2>数据备份</h2>
    <div class="row">
      <button class="ghost" onclick="exportData()">导出备份文件</button>
      <button class="ghost" onclick="document.getElementById('importFile').click()">导入备份</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(this)">
      <button class="del" onclick="resetData()">清空全部数据</button>
    </div>
    <p style="font-size:13px;color:#646a73;margin-top:8px">数据保存在本机浏览器，换设备或清缓存前请先导出备份。</p>
  </div>
</div>

<script>
var KEY='dorm_v1';
var db=load();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||init();}catch(e){return init();}}
function init(){return{members:[],tasks:[],rotates:[],done:{}};}
function save(){localStorage.setItem(KEY,JSON.stringify(db));}

function todayStr(){var d=new Date();return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function p(n){return n<10?'0'+n:''+n;}
function fmt(s){return s.slice(5);}

// 成员
function addMember(){
  var n=document.getElementById('mName').value.trim();
  if(!n)return;
  db.members.push({id:Date.now(),name:n});save();document.getElementById('mName').value='';renderAll();
}
function delMember(id){
  db.members=db.members.filter(function(m){return m.id!==id;});save();renderAll();
}

// 任务
function addTask(){
  var n=document.getElementById('tName').value.trim();
  var d=document.getElementById('tDate').value;
  var o=document.getElementById('tOwner').value;
  if(!n||!d)return alert('请填写任务名和日期');
  db.tasks.push({id:Date.now(),name:n,date:d,owner:o?Number(o):0});save();
  document.getElementById('tName').value='';renderAll();
}
function delTask(id){db.tasks=db.tasks.filter(function(t){return t.id!==id;});save();renderAll();}
function toggleDone(key){
  db.done[key]?delete db.done[key]:(db.done[key]=todayStr());save();renderAll();
}
function isDone(t){return !!db.done[t.id];}
function mname(id){var m=db.members.filter(function(x){return x.id===id;})[0];return m?m.name:'未指定';}

// 轮换
function addRotate(){
  var tid=Number(document.getElementById('rTask').value);
  var start=document.getElementById('rStart').value;
  var skip=document.getElementById('rSkip').checked;
  if(!tid||!start)return alert('请选择任务和开始日期');
  db.rotates.push({id:Date.now(),taskId:tid,start:start,skipWeekend:skip});save();renderAll();
}
function rotateList(r){
  var out=[],mem=db.members;
  if(!mem.length)return out;
  var t=db.tasks.filter(function(x){return x.id===r.taskId;})[0];
  if(!t)return out;
  var idx=db.rotates.indexOf(r);
  var n=0;
  for(var i=0;i<120;i++){
    var d=new Date(r.start);d.setDate(d.getDate()+i);
    var s=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
    var wd=d.getDay();
    if(r.skipWeekend&&(wd===0||wd===6))continue;
    if(n>=60)break;
    out.push({date:s,name:t.name,member:mem[(n+idx)%mem.length].name});
    n++;
  }
  return out;
}

// 渲染
function renderAll(){
  var om='<option value="">未指定</option>'+db.members.map(function(m){return '<option value="'+m.id+'">'+esc(m.name)+'</option>'}).join('');
  document.getElementById('tOwner').innerHTML=om;
  document.getElementById('rTask').innerHTML=db.tasks.map(function(t){return '<option value="'+t.id+'">'+esc(t.name)+'（'+fmt(t.date)+'）</option>'}).join('');
  document.getElementById('todayTitle').textContent='今日任务 · '+todayStr();
  renderToday();renderWeek();renderTasks();renderRotate();renderMember();renderHistory();
}
function esc(s){return String(s).replace(/[<>&]/g,'');}

function taskHtml(t,showDate){
  return '<table><tr><th>任务</th><th>负责人</th><th>'+(showDate?'日期':'状态')+'</th><th></th></tr>'+
   db.tasks.filter(function(x){return showDate?x.id===t.id:x.date===t.date;}).map(function(x){
    return '<tr class="'+(isDone(x)?'done':'')+'"><td>'+esc(x.name)+'</td><td>'+esc(mname(x.owner))+'</td>'+
    '<td>'+(showDate?fmt(x.date):(isDone(x)?'<span class="tag">已完成</span>':'<span class="tag">待完成</span>'))+'</td>'+
    '<td><button onclick="toggleDone('+x.id+')">'+(isDone(x)?'撤销':'完成')+'</button>'+
    (showDate?' <button class="del" onclick="delTask('+x.id+')">删</button>':'')+'</td></tr>';
  }).join('')+'</table>';
}

function renderToday(){
  var ts=db.tasks.filter(function(t){return t.date===todayStr();});
  document.getElementById('todayList').innerHTML=ts.length?taskHtml(ts[0],false):'<p style="color:#9aa0a6">今天没有安排任务</p>';
}
function renderWeek(){
  var w='';
  for(var i=1;i<=7;i++){
    var d=new Date();d.setDate(d.getDate()+i);
    var s=d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
    var items=db.tasks.filter(function(t){return t.date===s;});
    w+='<div style="padding:6px 0;border-bottom:1px solid #f0f1f3"><b>'+fmt(s)+'</b> '+
      (items.length?items.map(function(t){return esc(t.name)+'（'+esc(mname(t.owner))+'）';}).join('、'):'<span style="color:#9aa0a6">无</span>')+'</div>';
  }
  document.getElementById('weekList').innerHTML=w;
}
function renderTasks(){
  var ds={};db.tasks.forEach(function(t){(ds[t.date]=ds[t.date]||[]).push(t);});
  var keys=Object.keys(ds).sort();
  document.getElementById('taskList').innerHTML=keys.length?keys.map(function(k){return '<h2 style="margin-top:10px">'+fmt(k)+'</h2>'+taskHtml(ds[k][0],true);}).join(''):'<p style="color:#9aa0a6">暂无任务</p>';
}
function renderRotate(){
  var h=db.rotates.map(function(r){
    var t=db.tasks.filter(function(x){return x.id===r.taskId;})[0];
    return '<h2 style="margin-top:10px">'+esc(t?t.name:'已删除')+' · 起 '+fmt(r.start)+'</h2><table><tr><th>日期</th><th>负责人</th></tr>'+
      rotateList(r).slice(0,14).map(function(x){return '<tr><td>'+fmt(x.date)+'</td><td>'+esc(x.member)+'</td></tr>';}).join('')+'</table>';
  }).join('');
  document.getElementById('rotList').innerHTML=h||'<p style="color:#9aa0a6">暂无排班</p>';
}
function renderMember(){
  document.getElementById('memList').innerHTML=db.members.length?
   '<table><tr><th>姓名</th><th></th></tr>'+db.members.map(function(m){
    return '<tr><td>'+esc(m.name)+'</td><td><button class="del" onclick="delMember('+m.id+')">删除</button></td></tr>';}).join('')+'</table>'
   :'<p style="color:#9aa0a6">暂无成员</p>';
}
function renderHistory(){
  var e=Object.keys(db.done).map(function(k){
    var t=db.tasks.filter(function(x){return String(x.id)===String(k);})[0];
    return {k:k,d:db.done[k],n:t?t.name:'已删除任务',o:t?mname(t.owner):''};}).filter(function(x){return x.d;});
  e.sort(function(a,b){return a.d<b.d?1:-1;});
  document.getElementById('hisList').innerHTML=e.length?
   '<table><tr><th>日期</th><th>任务</th><th>负责人</th></tr>'+e.map(function(x){
    return '<tr><td>'+x.d+'</td><td>'+esc(x.n)+'</td><td>'+esc(x.o)+'</td></tr>';}).join('')+'</table>'
   :'<p style="color:#9aa0a6">还没有完成记录</p>';
}

// 备份
function exportData(){
  var blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='dorm-backup-'+todayStr()+'.json';
  a.click();
}
function importData(input){
  var f=input.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var d=JSON.parse(r.result);
      if(!d||!Array.isArray(d.members)||!Array.isArray(d.tasks))throw new Error('格式不对');
      if(!confirm('导入将覆盖当前全部数据，确定继续？'))return;
      db={members:d.members,tasks:d.tasks,rotates:d.rotates||[],done:d.done||{}};
      save();renderAll();alert('导入成功');
    }catch(e){alert('导入失败：文件格式不正确');}
    input.value='';
  };
  r.readAsText(f);
}
function resetData(){
  if(!confirm('确定清空全部成员、任务、排班和完成记录？此操作不可撤销。'))return;
  db=init();save();renderAll();
}

// tabs
document.querySelectorAll('#tabs button').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('#tabs button').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on');
    ['today','task','rotate','member','history'].forEach(function(t){
      document.getElementById('v-'+t).classList.toggle('hide',t!==b.dataset.t);});
  };
});

if(!localStorage.getItem(KEY))save();
document.getElementById('tDate').value=todayStr();
document.getElementById('rStart').value=todayStr();
renderAll();
</script>
</body>
</html>
